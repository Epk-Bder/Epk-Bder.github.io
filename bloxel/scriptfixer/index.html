<!DOCTYPE html>
<html>
<head>

	<title>Bloxel Script Fixer</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/x-icon" href="favicon.png">

	<script defer src="script.js"></script>
</head>

<body>
	<a href="../..">Homepage</a>
	<br><br>
	<img src="favicon.png" alt="Bloxel Logo">
	<h1>Bloxel Script Fixer</h1>
	<h3>Adds semicolons and removes comments easily so scripts can run in Bloxel executor</h3>

	<div id="input">
		<textarea id="entry" placeholder="Paste luau script here"></textarea>
		<br>
		<button id="convert">Convert</button>
	</div>
	<br>

	<p>Use the copy button to copy code, do not triple click text, it adds trailing and preceding spaces which makes it unreadable.</p>
	<button id="copy">Copy Code</button>

	<code id="output">Output script will be here</code>
</body>
</html>
